databases:
  # ── Render PostgreSQL ─────────────────────────────────────────────────────
  - name: medvision-db
    databaseName: medvision
    user: medvision_user
    plan: free           # Free tier: 256 MB, 90 day expiration. Upgrade to 'starter' ($7/mo) for backups
    region: oregon       # Choose: oregon, frankfurt, ohio, singapore

services:
  # ── Backend API (Docker) ──────────────────────────────────────────────────
  - type: web
    name: medvision-ai-backend
    env: docker                     # ← tells Render to use Dockerfile
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile    # relative to repo root
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ── App ──────────────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "False"

      # ── Database — auto-linked from the Render Postgres above ─────────────
      - key: DATABASE_URL
        fromDatabase:
          name: medvision-db
          property: connectionString

      # ── Security ─────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      # ── Firebase Admin SDK ────────────────────────────────────────────────
      # Paste your Firebase project ID
      - key: FIREBASE_PROJECT_ID
        value: your-firebase-project-id        # ← replace

      # Paste the ENTIRE service-account JSON as a single-line string.
      # Firebase console → Project Settings → Service Accounts → Generate key
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        value: ""                              # ← paste JSON here

      # ── CORS / Frontend ───────────────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://your-app.vercel.app     # ← replace after Vercel deploy

      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app,http://localhost:5173

      # ── ML Model Paths ────────────────────────────────────────────────────
      - key: CNN_MODEL_PATH
        value: backend/models/best_dfu_model.pth

      - key: SEGMENTATION_MODEL_PATH
        value: backend/models/segmentation_model.pth

      - key: MULTIMODAL_MODEL_PATH
        value: backend/models/multimodal_model.pth

      # ── Cloudinary (optional) ─────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        value: ""

      - key: CLOUDINARY_API_KEY
        value: ""

      - key: CLOUDINARY_API_SECRET
        value: ""
