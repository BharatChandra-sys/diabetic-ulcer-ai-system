databases:
  # ── Render PostgreSQL (free tier — 1 GB, 97 day expiry on free plan) ─────────
  - name: medvision-db
    databaseName: medvision
    user: medvision_user
    plan: free
    region: oregon

services:
  # ── Backend API ───────────────────────────────────────────────────────────────
  - type: web
    name: medvision-ai-backend
    env: python
    region: oregon
    plan: free
    runtime: python
    buildCommand: >
      pip install --upgrade pip setuptools wheel &&
      pip install -r backend/requirements.txt
    startCommand: >
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --log-level info
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ── App ────────────────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "False"

      # ── Database — linked to the Render Postgres above ─────────────────────
      # Render auto-injects DATABASE_URL when you link the database in the
      # dashboard (Environment → Add from Database).
      # If you use the blueprint, it resolves automatically via fromDatabase.
      - key: DATABASE_URL
        fromDatabase:
          name: medvision-db
          property: connectionString

      # ── Security ─────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      # ── Firebase Admin SDK ────────────────────────────────────────────────
      # Paste the entire service account JSON as a single-line string.
      # Get it from: Firebase console → Project Settings → Service Accounts
      #              → Generate new private key
      - key: FIREBASE_PROJECT_ID
        value: your-firebase-project-id        # ← replace

      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        value: ""                              # ← paste JSON string here

      # ── CORS / Frontend ───────────────────────────────────────────────────
      # Replace with your actual Vercel URL after first deploy
      - key: FRONTEND_URL
        value: https://your-app.vercel.app     # ← replace

      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app,http://localhost:5173,http://localhost:3000

      # ── ML Model Paths ────────────────────────────────────────────────────
      - key: CNN_MODEL_PATH
        value: backend/models/best_dfu_model.pth

      - key: SEGMENTATION_MODEL_PATH
        value: backend/models/segmentation_model.pth

      - key: MULTIMODAL_MODEL_PATH
        value: backend/models/multimodal_model.pth

      # ── Cloudinary (optional — for persistent image storage) ─────────────
      - key: CLOUDINARY_CLOUD_NAME
        value: ""

      - key: CLOUDINARY_API_KEY
        value: ""

      - key: CLOUDINARY_API_SECRET
        value: ""
